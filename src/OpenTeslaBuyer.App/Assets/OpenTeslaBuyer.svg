<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- OpenTeslaBuyer icon: a checked battery. tools/GenerateIcon.cs draws the same shapes to make OpenTeslaBuyer.ico
       (with a simpler filled battery at 16 and 20 px); change both together. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B82F6" />
      <stop offset="1" stop-color="#1E40AF" />
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)" />
  <rect x="44" y="78" width="144" height="100" rx="20" fill="#FFFFFF" fill-opacity="0.12" stroke="#FFFFFF" stroke-width="16" />
  <rect x="192" y="108" width="20" height="40" rx="6" fill="#FFFFFF" />
  <polyline points="76,128 106,156 158,100" fill="none" stroke="#4ADE80" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
</svg>
