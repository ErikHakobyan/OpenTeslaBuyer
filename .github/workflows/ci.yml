name: Build and test

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    # The app is WPF, so it builds on Windows; Core and the tests are cross-platform.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build OpenTeslaBuyer.sln --configuration Release
      - run: dotnet test OpenTeslaBuyer.sln --configuration Release --no-build
